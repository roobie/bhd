<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>BHD debug viewer</title>
    <style>
      :root {
        --bg: #f6f6f4;
        --fg: #1a1a1a;
        --map-bg: #fff;
        --lane: #c9c4b4;
        --border: #c8c8c8;
        --accent: #2d6cdf;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15171a;
          --fg: #e6e6e6;
          --map-bg: #1f2227;
          --lane: #4a4638;
          --border: #3a3e44;
          --accent: #6aa0ff;
        }
      }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
      main { max-width: 960px; margin: 0 auto; padding: 8px 16px; }
      h1 { font-size: 18px; margin: 4px 0; }
      h2 { font-size: 14px; margin: 12px 0 4px; }
      .note { margin: 0 0 8px; opacity: 0.8; }
      .replay { margin: 0 0 8px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px; font-weight: bold; }
      .replay.ok { border-color: #2e9d4f; }
      .replay.bad { border-color: #e03030; }
      .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
      button, input { font: inherit; color: inherit; background: var(--map-bg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 10px; }
      button.on { border-color: var(--accent); outline: 1px solid var(--accent); }
      input[type='number'] { width: 7em; }
      canvas { display: block; width: 100%; aspect-ratio: 2 / 1; max-height: 70vh; border: 1px solid var(--border); border-radius: 4px; }
      .hud { margin-top: 8px; display: grid; gap: 2px; }
      .heat { position: relative; height: 12px; border: 1px solid var(--border); background: var(--map-bg); }
      .heat .fill { height: 100%; background: #e8832a; }
      .heat i { position: absolute; top: -2px; bottom: -2px; width: 0; border-left: 2px solid var(--fg); }
      select { font: inherit; color: inherit; background: var(--map-bg); border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px; max-width: 100%; }
      .controls label { display: inline-flex; gap: 4px; align-items: center; }
      .controls.config input[type='number'] { width: 5.5em; }
      .chk { white-space: nowrap; }
      .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; margin-top: 8px; }
      .panel { border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; min-width: 0; }
      .panel h2 { margin-top: 4px; }
      .panel h3 { font-size: 13px; margin: 6px 0 2px; }
      .dim { opacity: 0.65; font-weight: normal; }
      .decision { margin-bottom: 4px; }
      .dhead { font-size: 12px; }
      .bar { display: grid; grid-template-columns: minmax(4em, 9em) 1fr 3.5em; gap: 4px; align-items: center; font: 11px/1.2 ui-monospace, monospace; }
      .bar .bid { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bar .track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
      .bar .track i { display: block; height: 100%; background: var(--accent); opacity: 0.5; }
      .bar.picked .track i { opacity: 1; }
      .bar.neg .track i { background: #e03030; }
      .bar .bval { text-align: right; }
      .spark { display: block; color: var(--accent); border-bottom: 1px solid var(--border); margin: 2px 0; }
      .phase { font-weight: bold; margin-left: 6px; }
      .log li.choice { opacity: 0.85; }
      .log li.cmd { opacity: 0.65; }
      .log { margin: 0; padding-left: 0; list-style: none; font: 12px/1.3 ui-monospace, monospace; max-height: 14em; overflow: auto; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./src/client/main.ts"></script>
  </body>
</html>
