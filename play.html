<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0c0c0e" />
    <title>BHD</title>
    <style>
      :root {
        --bg: #0c0c0e;
        --fg: #e6e2d8;
        --panel: rgb(20 20 24 / 0.86);
        --border: #3a3836;
        --accent: #d9a441;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.3 system-ui, sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #shell {
        position: fixed;
        inset: 0;
      }
      /* The canvas is the whole viewport; the camera fits the map into what the HUD leaves free. */
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      /* The HUD layer lets pointer events through; the HUD's own widgets turn them back on. */
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #hud :is(button, a, input, [data-hit]) {
        pointer-events: auto;
      }
      /* The lobby overlay (wave 10): hidden in solo; integration clears `hidden` while a room's lobby is up. */
      #lobby {
        position: absolute;
        inset: 0;
        overflow: auto;
        background: var(--bg);
      }
      #lobby[hidden] {
        display: none;
      }
      .viewer-link {
        position: absolute;
        right: calc(var(--safe-right) + 8px);
        bottom: calc(var(--safe-bottom) + 4px);
        font-size: 11px;
        opacity: 0.5;
        color: var(--fg);
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <canvas id="stage"></canvas>
      <div id="hud"></div>
      <div id="lobby" hidden></div>
    </div>
    <script type="module" src="./src/client/shell/main.ts"></script>
  </body>
</html>
